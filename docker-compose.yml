services:
  postgres:
    image: postgres:16-alpine
    container_name: vibe-coding-postgres
    restart: always
    environment:
      POSTGRES_DB: vibe_coding_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Rahasia12345
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
